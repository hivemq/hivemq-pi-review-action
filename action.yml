name: 'Pi PR Review - Resolve Event'
description: 'Determines if the current GitHub event should trigger a Pi PR review'
inputs:
  allowed-comment-associations:
    description: >-
      Comma-separated list of GitHub author associations allowed to trigger a review
      via /review comment (e.g. OWNER,MEMBER,COLLABORATOR). Leave empty to allow anyone.
    required: false
    default: 'OWNER,MEMBER,COLLABORATOR'
outputs:
  should-run:
    description: 'Whether the review should run (true/false)'
    value: ${{ steps.resolve.outputs.should-run }}
  pr-number:
    description: 'The PR number to review'
    value: ${{ steps.resolve.outputs.pr-number }}
  post-comment:
    description: 'Whether to post/update a PR comment (true/false)'
    value: ${{ steps.resolve.outputs.post-comment }}
  trigger-kind:
    description: 'How the review was triggered: auto | manual | comment | dispatch'
    value: ${{ steps.resolve.outputs.trigger-kind }}
  auto-approve-eligible:
    description: 'Stage 1 gate: PR is a candidate for AI auto-approve (true/false)'
    value: ${{ steps.gate.outputs.auto-approve-eligible }}
  force-human:
    description: 'Stage 1 gate: a hard rule requires a human reviewer (true/false)'
    value: ${{ steps.gate.outputs.force-human }}
  gate-reason:
    description: 'Stage 1 gate: short machine reason for the verdict'
    value: ${{ steps.gate.outputs.gate-reason }}
runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      env:
        COMMENT_BODY: ${{ github.event.comment.body }}
      run: |
        should_run=false
        pr_number=""
        post_comment=false
        trigger_kind=none

        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          should_run=true
          pr_number="${{ github.event.inputs.pr_number }}"
          post_comment="${{ github.event.inputs.post_comment }}"
          if [ -z "$post_comment" ]; then
            post_comment=false
          fi
          trigger_kind=dispatch

        elif [ "${{ github.event_name }}" = "issue_comment" ]; then
          # Only trigger on PR comments that start with /review
          is_pr="${{ github.event.issue.pull_request && 'true' || 'false' }}"
          comment_body="$COMMENT_BODY"
          allowed_associations="${{ inputs.allowed-comment-associations }}"
          author_association="${{ github.event.comment.author_association }}"

          if [ "$is_pr" = "true" ] && [[ "$comment_body" == /review* ]]; then
            if [ -z "$allowed_associations" ] || echo ",$allowed_associations," | grep -qi ",$author_association,"; then
              should_run=true
              pr_number="${{ github.event.issue.number }}"
              post_comment=true
              trigger_kind=comment
            else
              echo "Ignoring /review from author_association=$author_association (allowed: $allowed_associations)"
            fi
          fi

        elif [ "${{ github.event_name }}" = "pull_request" ]; then
          is_draft="${{ github.event.pull_request.draft }}"
          label_name="${{ github.event.label.name }}"
          # Two label triggers:
          #   'review'        — the standard trigger; gated to non-draft PRs so
          #                     that an auto-applied 'review' label never starts
          #                     a review on a draft.
          #   'manual-review' — an explicit, manually-added label that triggers
          #                     regardless of draft state, letting authors get a
          #                     Pi review before marking the PR ready for review.
          # trigger_kind distinguishes the auto path (bot-applied 'review' on
          # checks-pass, the only path eligible for auto-approve) from a human
          # explicitly asking for a review via 'manual-review'.
          if [ "$label_name" = "review" ] && [ "$is_draft" != "true" ]; then
            should_run=true
            pr_number="${{ github.event.pull_request.number }}"
            post_comment=true
            trigger_kind=auto
          elif [ "$label_name" = "manual-review" ]; then
            should_run=true
            pr_number="${{ github.event.pull_request.number }}"
            post_comment=true
            trigger_kind=manual
          fi
        fi

        echo "should-run=$should_run" >> "$GITHUB_OUTPUT"
        echo "pr-number=$pr_number" >> "$GITHUB_OUTPUT"
        echo "post-comment=$post_comment" >> "$GITHUB_OUTPUT"
        echo "trigger-kind=$trigger_kind" >> "$GITHUB_OUTPUT"

        echo "Event: ${{ github.event_name }}"
        echo "should-run=$should_run"
        echo "pr-number=$pr_number"
        echo "post-comment=$post_comment"
        echo "trigger-kind=$trigger_kind"

    - id: gate
      name: Stage 1 sensitivity gate
      if: ${{ steps.resolve.outputs.should-run == 'true' }}
      shell: bash
      env:
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ steps.resolve.outputs.pr-number }}
        TRIGGER_KIND: ${{ steps.resolve.outputs.trigger-kind }}
        GH_TOKEN: ${{ github.token }}
      run: bash "${{ github.action_path }}/scripts/auto-approve-gate.sh"
