name: Gate Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  gate-unit-tests:
    name: Stage 1 gate unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats + shellcheck
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck
      - name: Shellcheck gate scripts
        run: shellcheck scripts/auto-approve-gate.sh scripts/lib/gate.sh
      - name: Run bats tests
        run: bats tests/gate.bats
