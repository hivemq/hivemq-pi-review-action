name: Test

# Runs on every pull request, deliberately without a `paths:` filter: a filtered
# workflow produces no check run at all, which leaves the branch status pending
# and blocks Renovate from automerging its action digest bumps. The suite takes
# well under a second, so running it on every PR is effectively free.
on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
