name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Create release
        uses: softprops/action-gh-release@v3.0.4

      - name: Update major tag
        uses: cssnr/update-version-tags-action@v2.1.1
        with:
          minor: false
